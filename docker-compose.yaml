version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data_with_elasticsearch:/var/lib/postgresql/data

    networks:
      - backend

  elasticsearch:
    image: elasticsearch:8.19.18

    container_name: elasticsearch

    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    networks:
      - backend


  kibana:
    image: kibana:8.19.18

    container_name: kibana

    restart: unless-stopped

    depends_on:
      - elasticsearch

    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

    ports:
      - "5601:5601"

    networks:
      - backend

volumes:
  postgres_data_with_elasticsearch:
  elasticsearch_data:
networks:
  backend: